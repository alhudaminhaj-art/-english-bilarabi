  <style>
:root {
  --navy: #071422;
  --navy-2: #0c1e36;
  --navy-3: #152b4a;
  --navy-4: #1c3a5e;
  --royal: #2a5a9e;
  --gold: #c6a15b;
  --gold-2: #e0c37a;
  --ivory: #f4efe4;
  --paper: #f7f3ea;
  --ink: #102033;
  --muted: #8b97a8;
  --ok: #3d8b6e;
  --danger: #c45c4a;
  --bg: #071422;
  --bg-elev: #0c1e36;
  --bg-subtle: #152b4a;
  --fg: #f4efe4;
  --fg-muted: #8b97a8;
  --line: rgba(198, 161, 91, 0.18);
  --line-strong: rgba(198, 161, 91, 0.38);
  --shadow: 0 18px 50px -24px rgb(7 20 34 / 0.55);
  --font: "Cairo", "Segoe UI", system-ui, sans-serif;
  --display: "Cormorant Garamond", "Cairo", Georgia, serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 18px;
  --r-xl: 28px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --fast: 250ms;
  --quick: 150ms;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

html.light {
  --bg: #f7f3ea;
  --bg-elev: #fffdf8;
  --bg-subtle: #efe8d8;
  --fg: #102033;
  --fg-muted: #5d6b7c;
  --line: rgba(16, 32, 51, 0.12);
  --line-strong: rgba(16, 32, 51, 0.28);
  --shadow: 0 18px 40px -24px rgb(16 32 51 / 0.18);
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
html {
  -webkit-font-smoothing: antialiased;
  scroll-behavior: smooth;
}
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  line-height: 1.6;
}
button, [role="button"] { cursor: pointer; font-family: inherit; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
h1, h2, h3 { letter-spacing: -0.02em; line-height: 1.2; text-wrap: balance; font-weight: 600; }
p { text-wrap: pretty; }
.en { font-family: var(--display); letter-spacing: 0; direction: ltr; unicode-bidi: isolate; }
.tabular { font-variant-numeric: tabular-nums; }

.wrap { width: min(1120px, calc(100% - 32px)); margin-inline: auto; }
.site { min-height: 100dvh; display: flex; flex-direction: column; padding-bottom: 88px; }
header.top {
  position: sticky; top: 0; z-index: 30;
  backdrop-filter: blur(14px);
  background: color-mix(in oklab, var(--bg) 88%, transparent);
  border-bottom: 1px solid var(--line);
}
.top-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 68px; }
.brand { display: flex; align-items: center; gap: 10px; }
.mark {
  width: 40px; height: 40px; border-radius: var(--r-md);
  border: 1px solid var(--line-strong);
  display: grid; place-items: center;
  color: var(--gold); font-family: var(--display); font-size: 1.2rem; font-weight: 600;
  background: var(--navy-2);
}
html.light .mark { background: var(--ink); color: var(--gold-2); }
.brand small { display: block; color: var(--fg-muted); font-size: 11px; }
.nav-desk { display: none; gap: 4px; }
.nav-desk a, .icon-btn, .btn {
  min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: var(--r-md); border: 1px solid transparent; padding: 0 14px;
  background: transparent; color: var(--fg-muted); font-size: 14px;
  transition: background var(--quick) var(--ease), color var(--quick) var(--ease), border-color var(--quick) var(--ease), transform var(--quick) var(--ease);
}
.nav-desk a:hover, .icon-btn:hover { color: var(--fg); background: var(--bg-subtle); }
.nav-desk a.active { color: var(--gold); background: color-mix(in oklab, var(--gold) 14%, transparent); }
.icon-btn { width: 44px; padding: 0; border-color: var(--line); color: var(--fg); }
.btn:active { transform: scale(0.98); }
.btn-gold { background: var(--gold); color: var(--navy); font-weight: 600; }
.btn-gold:hover { background: var(--gold-2); }
.btn-navy { background: var(--navy-3); color: var(--ivory); border-color: var(--line); }
.btn-line { border-color: var(--line-strong); color: var(--gold); }
.btn-lg { min-height: 48px; padding: 0 22px; border-radius: 14px; font-size: 16px; }
.top-actions { display: flex; align-items: center; gap: 8px; }

main { flex: 1; }
.hero { padding: 56px 0 40px; border-bottom: 1px solid var(--line); position: relative; overflow: hidden; }
.hero::before {
  content: ""; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 80% 0%, color-mix(in oklab, var(--royal) 22%, transparent), transparent 52%),
    linear-gradient(180deg, color-mix(in oklab, var(--navy-3) 35%, transparent), transparent);
  pointer-events: none;
}
html.light .hero::before { background: radial-gradient(ellipse at 80% 0%, rgba(42,90,158,.08), transparent 55%); }
.hero-grid { position: relative; display: grid; gap: 36px; }
.kicker { color: var(--gold); font-size: 12px; letter-spacing: 0.22em; }
.hero h1 { font-size: clamp(1.9rem, 4vw, 3.1rem); margin: 14px 0 0; }
.lead { color: var(--fg-muted); max-width: 42rem; margin-top: 14px; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
.panel {
  border: 1px solid var(--line);
  background: var(--bg-elev);
  border-radius: var(--r-xl);
  padding: 20px;
  box-shadow: var(--shadow);
}
.hero-card { min-height: 220px; display: flex; flex-direction: column; justify-content: space-between; }
.hero-card .path { color: var(--gold); font-size: 1.4rem; }
.muted { color: var(--fg-muted); }
.tiny { font-size: 12px; color: var(--fg-muted); }

section.block { padding: 56px 0; }
section.alt { background: var(--bg-elev); border-block: 1px solid var(--line); }
.grid-3 { display: grid; gap: 14px; }
.grid-4 { display: grid; gap: 12px; }
.card {
  border: 1px solid var(--line);
  background: var(--bg-elev);
  border-radius: 22px;
  padding: 18px;
}
section.alt .card, .hero-card { background: var(--bg); }
.card h3 { margin: 10px 0 6px; font-size: 1.05rem; }
.ico {
  width: 36px; height: 36px; color: var(--gold);
}
.ico svg { width: 22px; height: 22px; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; text-align: center; }
.stats b { display: block; color: var(--gold); font-family: var(--display); font-size: 2rem; font-weight: 600; }
details.faq {
  border: 1px solid var(--line); background: var(--bg-elev); border-radius: 22px; padding: 16px 18px;
}
details.faq summary { cursor: pointer; font-weight: 600; list-style: none; }
details.faq summary::-webkit-details-marker { display: none; }
details.faq p { margin: 8px 0 0; color: var(--fg-muted); font-size: 14px; }

.bottom-nav {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 40;
  background: color-mix(in oklab, var(--bg) 94%, transparent);
  backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
}
.bottom-nav a {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  min-height: 52px; justify-content: center;
  color: var(--fg-muted); font-size: 10px; border-radius: 12px;
}
.bottom-nav a.active { color: var(--gold); }
.bottom-nav svg { width: 20px; height: 20px; }

.page { padding: 28px 0 40px; }
.page h1 { font-size: clamp(1.6rem, 3vw, 2.2rem); margin: 6px 0 8px; }
.filters { display: flex; gap: 8px; overflow: auto; padding-bottom: 8px; margin: 16px 0; }
.chip {
  flex: 0 0 auto; min-height: 40px; padding: 0 14px; border-radius: 999px;
  border: 1px solid var(--line); background: transparent; color: var(--fg-muted); font-size: 13px;
}
.chip.on { background: color-mix(in oklab, var(--gold) 16%, transparent); color: var(--gold); border-color: var(--line-strong); }

.letters { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.letter {
  border: 1px solid var(--line); background: var(--bg-elev); border-radius: 18px;
  padding: 12px 8px; text-align: center; min-height: 96px;
}
.letter b { display: block; font-family: var(--display); font-size: 1.6rem; color: var(--gold); }
.words { display: grid; gap: 10px; }
.word {
  border: 1px solid var(--line); background: var(--bg-elev); border-radius: 22px; padding: 16px;
  display: grid; gap: 8px;
}
.word-top { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
.speak, .save {
  width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line);
  background: transparent; color: var(--gold); display: grid; place-items: center;
}
.save.on { background: color-mix(in oklab, var(--gold) 16%, transparent); }
.search {
  width: 100%; min-height: 48px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--bg-elev); color: var(--fg); padding: 0 16px; font: inherit;
}

.unit { margin-bottom: 18px; }
.unit h2 { font-size: 1.15rem; margin-bottom: 8px; }
.lesson-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  border: 1px solid var(--line); background: var(--bg-elev); border-radius: 18px;
  padding: 12px 14px; margin-bottom: 8px; text-align: start; width: 100%; color: inherit;
}
.lesson-row.locked { opacity: 0.55; }
.badge {
  font-size: 11px; color: var(--gold); border: 1px solid var(--line-strong);
  border-radius: 999px; padding: 2px 8px;
}

.obj { margin: 0; padding: 0 18px; color: var(--fg-muted); }
.ex { border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin: 8px 0; }
.q { margin: 14px 0; padding: 16px; border: 1px solid var(--line); border-radius: 18px; background: var(--bg-elev); }
.opts { display: grid; gap: 8px; margin-top: 10px; }
.opt {
  min-height: 44px; text-align: start; border-radius: 12px; border: 1px solid var(--line);
  background: transparent; color: var(--fg); padding: 8px 12px;
}
.opt.ok { border-color: var(--ok); background: color-mix(in oklab, var(--ok) 16%, transparent); }
.opt.bad { border-color: var(--danger); background: color-mix(in oklab, var(--danger) 14%, transparent); }
.field {
  width: 100%; min-height: 48px; margin-top: 10px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--bg); color: var(--fg); padding: 0 12px; font: inherit;
}
.feedback { margin-top: 8px; font-size: 14px; }
.feedback.ok { color: var(--ok); }
.feedback.bad { color: var(--danger); }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }

.dialogue { display: grid; gap: 10px; }
.line { border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; background: var(--bg-elev); }
.line b { color: var(--gold); font-size: 12px; }

.progress-bar { height: 8px; background: var(--bg-subtle); border-radius: 99px; overflow: hidden; }
.progress-bar span { display: block; height: 100%; background: var(--gold); border-radius: inherit; }

table.g { width: 100%; border-collapse: collapse; font-size: 14px; margin: 12px 0; }
table.g th, table.g td { border-bottom: 1px solid var(--line); padding: 8px 6px; text-align: start; }
.good { color: var(--ok); } .bad { color: var(--danger); }

.toast {
  position: fixed; bottom: 96px; inset-inline: 16px; margin-inline: auto; width: max-content; max-width: calc(100% - 32px);
  background: var(--ink); color: var(--ivory); border: 1px solid var(--gold);
  padding: 10px 16px; border-radius: 14px; z-index: 60; font-size: 14px;
}

.cert {
  border: 2px solid var(--gold); border-radius: 24px; padding: 28px 20px; text-align: center;
  background: linear-gradient(180deg, var(--bg-elev), var(--bg));
}
.cert h2 { font-family: var(--display); font-size: 2rem; color: var(--gold); }

.rate { display: flex; gap: 6px; }
.rate button { min-height: 36px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--fg-muted); font-size: 12px; }
.rate button.on { color: var(--gold); border-color: var(--line-strong); }

footer.site-foot { border-top: 1px solid var(--line); padding: 28px 0 24px; margin-top: auto; color: var(--fg-muted); font-size: 13px; }
footer.site-foot .cols { display: grid; gap: 18px; }
footer.site-foot a { display: block; padding: 4px 0; color: var(--fg-muted); }
footer.site-foot a:hover { color: var(--gold); }

@media (min-width: 800px) {
  .nav-desk { display: flex; }
  .bottom-nav { display: none; }
  .site { padding-bottom: 0; }
  .hero-grid { grid-template-columns: 1.15fr 0.85fr; align-items: center; }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  .stats { grid-template-columns: repeat(4, 1fr); }
  .words { grid-template-columns: 1fr 1fr; }
  footer.site-foot .cols { grid-template-columns: 1.4fr 1fr 1fr 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

  </style>

/* English بالعربي — single-file GitHub Pages app */
(function () {
  const DATA = window.DATA;
  const KEY = "english-arabi-v1";
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  const svg = {
    home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>',

    type: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7V5h16v2M12 5v14M8 19h8"/></svg>',
    chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 6h14v10H8l-3 3z"/></svg>',
    user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.2"/><path d="M5 19c1.4-3 4-4.5 7-4.5S17.6 16 19 19"/></svg>',

    star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3 2.4 6.6H21l-5.4 4 2.1 6.4L12 16.8 6.3 20l2.1-6.4L3 9.6h6.6z"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m5 12 5 5 9-10"/></svg>',
    lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  };

  function load() {
    try {
      return JSON.parse(localStorage.getItem(KEY) || "null") || seed();
    } catch {
      return seed();
    }
  }
  function seed() {
    return {
      name: "",
      theme: "dark",
      completed: [],
      saved: [],
      xp: 0,
      streak: 0,
      lastDay: "",
      mistakes: [],
      scores: {},
      rate: 0.85,
    };
  }
  function save() {
    localStorage.setItem(KEY, JSON.stringify(P));
  }
  let P = load();

  function today() {
    return new Date().toISOString().slice(0, 10);
  }
  function touchStreak() {
    const d = today();
    if (P.lastDay === d) return;
    const y = new Date();
    y.setDate(y.getDate() - 1);
    const ys = y.toISOString().slice(0, 10);
    P.streak = P.lastDay === ys ? P.streak + 1 : 1;
    P.lastDay = d;
    save();
  }

  let rate = P.rate || 0.85;
  function speak(text, lang) {
    if (!window.speechSynthesis || !text) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang || "en-US";
    u.rate = rate;
    speechSynthesis.speak(u);
  }

  function toast(msg) {
    let el = $(".toast");
    if (!el) {
      el = document.createElement("div");
      el.className = "toast";
      el.id = "toast";
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toast.t);
    toast.t = setTimeout(() => (el.hidden = true), 2200);
  }

  function applyTheme() {
    document.documentElement.classList.toggle("light", P.theme === "light");
  }

  function parseHash() {
    const h = (location.hash || "#/home").replace(/^#\/?/, "");
    const [view, id] = h.split("/");
    return { view: view || "home", id: id || "" };
  }
  function go(view, id) {
    location.hash = id ? `#/${view}/${id}` : `#/${view}`;
  }

  function shuffle(arr) {
    return [...arr].sort(() => Math.random() - 0.5);
  }
  function wordById(id) {
    return DATA.words.find((w) => w.id === id);
  }
  function isDone(id) {
    return P.completed.includes(id);
  }
  function locked(lesson) {
    const prev = DATA.lessons.find((l) => l.order === lesson.order - 1);
    return prev ? !isDone(prev.id) : false;
  }

    { id: "home", label: "الرئيسية", icon: "home" },
    { id: "learn", label: "الدروس", icon: "book" },

    { id: "talks", label: "محادثة", icon: "chat" },
    { id: "me", label: "تقدمي", icon: "user" },

  function header() {
    const { view } = parseHash();
    return `

        <div class="wrap top-inner">
          <a class="brand" data-go="home">
            <span class="mark">E</span>
            <span><b>English بالعربي</b><small>البركة ديجيتال</small></span>
          </a>

            ${NAV.map((n) => `<a data-go="${n.id}" class="${view === n.id ? "active" : ""}">${n.label}</a>`).join("")}

  }

          <div><b>مهارات</b><a data-go="talks">المحادثات</a><a data-go="quiz">تحديد المستوى</a><a data-go="me">الإنجازات</a></div>
          <div><b>المنصة</b><a data-go="about">عن المنصة</a></div>
        </div>
      </footer>`;
  }

  function viewHome() {
    const feats = [
      { t: "دروس قصيرة متدرجة", b: "من الحروف إلى المحادثة وفق Pre-A1 ثم A1 ثم A2.", i: "book" },
      { t: "شرح بالعربية", b: "كل قاعدة ومثال مشروح بالفصحى السهلة مع نطق تقريبي.", i: "type" },
      { t: "نطق صوتي فوري", b: "استمع للكلمة والجملة بسرعة مناسبة، وأعد التشغيل متى شئت.", i: "play" },
      { t: "تمارين واختبارات", b: "اختيار، ترتيب، إملاء، واستماع مع تصحيح فوري بالعربية.", i: "check" },
      { t: "محادثات يومية", b: "التعارف، البيت، المطعم، المطار، والعيادة بجمل جاهزة.", i: "chat" },
      { t: "تتبع وشهادات", b: "نقاط وسلسلة أيام. شهادة رقمية بإشراف عبد الله أحمد.", i: "star" },
    ];
    return `
      <section class="hero"><div class="wrap hero-grid">
        <div>
          <p class="kicker">البركة ديجيتال · إشراف عبد الله أحمد</p>
          <h1>تعلّم الإنجليزية من الصفر وبأسلوب عربي مبسّط</h1>
          <p class="lead">منصة جاهزة للعمل من ملف واحد. دروس، حروف، مفردات، محادثات واختبارات — تقدّمك يُحفظ على هذا الجهاز.</p>
          <div class="cta">
            <button class="btn btn-gold btn-lg" data-go="learn">ابدأ مجانًا</button>
            <button class="btn btn-line btn-lg" data-go="quiz">اختبار تحديد المستوى</button>
          </div>
          <p class="tiny" style="margin-top:14px">ابدأ من الصفر… وتحدّث الإنجليزية بثقة</p>
        </div>
        <div class="panel hero-card">
          <p class="kicker">المسار</p>
          <p class="path en">Pre-A1 → A1 → A2</p>

          <button class="btn btn-navy" data-go="alphabet">ابدأ بالحروف</button>

      </div></section>

        <div class="grid-3" style="margin-top:22px">${feats
          .map((f) => `<article class="card"><div class="ico">${svg[f.i]}</div><h3>${f.t}</h3><p class="muted">${f.b}</p></article>`)
          .join("")}</div>
      </div></section>
      <section class="block alt"><div class="wrap">
        <p class="kicker">المسار التعليمي</p>
        <h2>ثلاث درجات حتى المحادثة اليومية</h2>
        <div class="grid-3" style="margin-top:22px">${DATA.levels
          .map(
            (lv, i) =>
              `<article class="card"><p class="en tiny">${lv.titleEn}</p><h3>${lv.titleAr}</h3><p class="muted">${lv.blurb}</p><p class="tiny">${DATA.units.filter((u) => u.levelId === lv.id).length} وحدات · ${DATA.lessons.filter((l) => l.levelId === lv.id).length} دروس</p><span class="en" style="float:left;font-size:3rem;color:var(--gold);opacity:.12">${i + 1}</span></article>`,
          )
          .join("")}</div>
        <div class="cta"><button class="btn btn-line" data-go="learn">عرض خريطة التعلم</button></div>
      </div></section>
      <section class="block"><div class="wrap">
        <p class="kicker">مهارات</p>
        <h2>ابدأ من أي باب</h2>

          <a class="card" data-go="alphabet"><h3>الحروف والنطق</h3><p class="muted">الأبجدية كاملة مع الصوت.</p></a>
          <a class="card" data-go="vocab"><h3>المفردات</h3><p class="muted">${DATA.words.length} كلمة مصنّفة حسب الحياة.</p></a>
          <a class="card" data-go="grammar"><h3>القواعد</h3><p class="muted">شرح عربي وجداول وتمارين.</p></a>

          <button class="btn btn-navy btn-lg" data-go="about">عن المنصة</button>

      </div></section>`;
  }

  function viewLearn() {
    const units = DATA.units;
    return `<div class="page wrap">
      <p class="kicker">خريطة التعلم</p>

      <p class="muted">يُفتح الدرس التالي بعد إكمال الحالي. تقدّمك محفوظ على هذا الجهاز.</p>
      ${units
        .map((u) => {
          const ls = DATA.lessons.filter((l) => l.unitId === u.id);
          return `<section class="unit" style="margin-top:22px">
            <p class="tiny en">${u.titleEn} · ${u.levelId.toUpperCase()}</p>
            <h2>${u.titleAr}</h2>
            <p class="tiny">${u.blurbAr}</p>
            ${ls
              .map((l) => {
                const lk = locked(l);
                const done = isDone(l.id);
                return `<button class="lesson-row ${lk ? "locked" : ""}" data-go="lesson" data-id="${l.id}" ${lk ? "data-locked=1" : ""}>
                  <span><b>${l.titleAr}</b><br><span class="tiny en">${l.titleEn} · ${l.minutes} د</span></span>
                  <span>${done ? svg.check : lk ? svg.lock : svg.play}</span>
                </button>`;
              })
              .join("")}
          </section>`;
        })
        .join("")}
    </div>`;
  }

  function viewLesson(id) {

      <p class="kicker">${l.levelId.toUpperCase()} · ${l.minutes} دقيقة</p>

      <p class="en muted">${l.titleEn}</p>
      <h3 style="margin-top:22px">أهداف الدرس</h3>
      <ul class="obj">${(l.objectives || []).map((o) => `<li>${o}</li>`).join("")}</ul>

  function wordCard(w) {
    const on = P.saved.includes(w.id);
    return `<article class="word">
      <div class="word-top">
        <div><b class="en" style="font-size:1.25rem">${w.en}</b><div class="tiny">${w.ar} · ${w.phonetic}</div></div>
        <div style="display:flex;gap:6px">
          <button class="speak" data-speak="${encodeURIComponent(w.en)}" aria-label="نطق">${svg.play}</button>
          <button class="save ${on ? "on" : ""}" data-save="${w.id}" aria-label="حفظ">${svg.star}</button>
        </div>
      </div>
      <p class="en tiny">${w.exampleEn}</p>
      <p class="tiny">${w.exampleAr}</p>
    </article>`;
  }

  function renderQ(q, i, ns) {
    const key = ns + "-" + q.id;
    if (q.type === "fill" || q.type === "translate") {
      return `<div class="q" data-qid="${q.id}" data-ns="${ns}">
        <p>${i + 1}. ${q.promptAr}${q.promptEn ? ` <span class="en">(${q.promptEn})</span>` : ""}</p>
        <input class="field" data-fill="${key}" placeholder="اكتب الإجابة">
        <button class="btn btn-navy" style="margin-top:8px" data-check-fill="${key}" data-correct="${encodeURIComponent(q.correct)}" data-why="${encodeURIComponent(q.explanationAr)}">تحقق</button>
        <div class="feedback" data-fb="${key}"></div>
      </div>`;
    }
    if (q.type === "order") {
      const opts = shuffle(q.options || q.correct.split(" "));
      return `<div class="q" data-qid="${q.id}">
        <p>${i + 1}. ${q.promptAr}</p>
        <p class="tiny">اضغط الكلمات بالترتيب الصحيح</p>
        <div class="opts" data-order="${key}" data-correct="${encodeURIComponent(q.correct)}" data-why="${encodeURIComponent(q.explanationAr)}">
          ${opts.map((o) => `<button class="opt" data-token="${encodeURIComponent(o)}">${o}</button>`).join("")}
        </div>
        <p class="tiny" data-built="${key}"></p>
        <div class="feedback" data-fb="${key}"></div>
      </div>`;
    }
    const opts = q.options || [];
    const listen = q.type === "listen" && q.audioText
      ? `<button class="btn btn-line" data-speak="${encodeURIComponent(q.audioText)}">${svg.play} استمع</button>`
      : "";
    return `<div class="q" data-qid="${q.id}">
      <p>${i + 1}. ${q.promptAr}</p>
      ${listen}
      <div class="opts">${opts
        .map(
          (o) =>
            `<button class="opt" data-pick="${encodeURIComponent(o)}" data-correct="${encodeURIComponent(q.correct)}" data-why="${encodeURIComponent(q.explanationAr)}" data-fb="${key}">${o}</button>`,
        )
        .join("")}</div>
      <div class="feedback" data-fb="${key}"></div>
    </div>`;
  }

  function viewMe() {
    const total = DATA.lessons.length;
    const done = P.completed.length;
    const pct = Math.round((done / total) * 100);
    const name = P.name || "متعلم";
    const badges = [
      { id: "first", ok: done >= 1, t: "أول خطوة", n: "أكمل درسًا واحدًا" },
      { id: "s3", ok: P.streak >= 3, t: "ثلاثة أيام", n: "سلسلة تعلم 3 أيام" },
      { id: "w20", ok: P.saved.length >= 20, t: "جامع الكلمات", n: "احفظ 20 كلمة" },
      { id: "half", ok: done >= 9, t: "منتصف الطريق", n: "أكمل نصف الدروس" },
      { id: "all", ok: done >= total, t: "مستوى مكتمل", n: "أنهِ كل الدروس" },

      done >= 8

    return `<div class="page wrap">
      <p class="kicker">لوحة المتعلم</p>

        <p class="tiny">${done} / ${total} درسًا · ${P.xp} نقطة · سلسلة ${P.streak} يومًا · ${P.saved.length} كلمة محفوظة</p>

        .map((b) => `<article class="card"><div class="ico">${b.ok ? svg.check : svg.star}</div><h3>${b.t}</h3><p class="muted">${b.n}</p></article>`)

      ${cert}
      <h3 style="margin-top:24px">كلمات محفوظة</h3>

      <h3 style="margin-top:24px">أخطائي</h3>
      ${P.mistakes.length ? P.mistakes.slice(-12).map((m) => `<p class="tiny">• ${m}</p>`).join("") : "<p class='muted'>لا أخطاء مسجّلة.</p>"}
    </div>`;

  function page() {
    const { view, id } = parseHash();
    const map = {
      home: viewHome,
      learn: viewLearn,
      lesson: () => viewLesson(id),
      alphabet: viewAlphabet,
      vocab: () => viewVocab(id),
      grammar: () => viewGrammar(id),
      talks: () => viewTalks(id),
      quiz: viewQuiz,
      me: viewMe,
      about: viewAbout,
    };
    const body = (map[view] || viewHome)();
    $("#app").innerHTML = `<div class="site">${header()}<main>${body}</main>${footer()}${bottom()}</div>`;
    const vq = $("#vocab-q");
    if (vq) {
      vq.focus();
      const len = vq.value.length;
      vq.setSelectionRange(len, len);
    }
    window.scrollTo(0, 0);
  }

  const orderState = {};

  document.addEventListener("input", (e) => {
    const el = e.target;
    if (!(el instanceof HTMLInputElement)) return;
    if (el.id === "vocab-q") {
      window.__q = el.value;
      const { id } = parseHash();
      const main = $("main");
      if (main) main.innerHTML = viewVocab(id);
      const n = $("#vocab-q");
      if (n) {
        n.focus();
        n.setSelectionRange(n.value.length, n.value.length);
      }
    }
    if (el.id === "uname") {
      P.name = el.value.trim();
      save();
    }
  });

  document.addEventListener("click", (e) => {
    if (!(e.target instanceof Element)) return;
    const t = e.target.closest("[data-go]");
    if (t) {
      if (t.dataset.locked) {
        toast("أكمل الدرس السابق أولًا");
        return;
      }
      go(t.dataset.go, t.dataset.id || "");
      return;
    }
    const th = e.target.closest("[data-act='theme']");
    if (th) {
      P.theme = P.theme === "light" ? "dark" : "light";
      save();
      applyTheme();
      page();
      return;
    }
    const sp = e.target.closest("[data-speak]");
    if (sp) {
      speak(decodeURIComponent(sp.dataset.speak));
      if (sp.dataset.speak2) setTimeout(() => speak(decodeURIComponent(sp.dataset.speak2)), 700);
      return;
    }
    const rt = e.target.closest("[data-rate]");
    if (rt) {
      rate = Number(rt.dataset.rate);
      P.rate = rate;
      save();
      page();
      return;
    }
    const sv = e.target.closest("[data-save]");
    if (sv) {
      const id = sv.dataset.save;
      if (P.saved.includes(id)) P.saved = P.saved.filter((x) => x !== id);
      else {
        P.saved.push(id);
        P.xp += 2;
        touchStreak();
      }
      save();
      page();
      return;
    }
    const pick = e.target.closest("[data-pick]");
    if (pick) {
      const parent = pick.parentElement;
      $$(".opt", parent).forEach((b) => b.classList.remove("ok", "bad"));
      const val = decodeURIComponent(pick.dataset.pick);
      const correct = decodeURIComponent(pick.dataset.correct);
      const why = decodeURIComponent(pick.dataset.why);
      const ok = val === correct;
      pick.classList.add(ok ? "ok" : "bad");
      if (!ok) {
        const right = $$(".opt", parent).find((b) => decodeURIComponent(b.dataset.pick) === correct);
        if (right) right.classList.add("ok");
        P.mistakes.push(why);
        save();
      } else {
        P.xp += 1;
        touchStreak();
        save();
      }
      const fb = document.querySelector(`[data-fb="${pick.dataset.fb}"]`);
      if (fb) {
        fb.className = "feedback " + (ok ? "ok" : "bad");
        fb.textContent = (ok ? "أحسنت. " : "حاول مرة أخرى. ") + why;
      }
      return;
    }
    const cf = e.target.closest("[data-check-fill]");
    if (cf) {
      const key = cf.dataset.checkFill;
      const input = document.querySelector(`[data-fill="${key}"]`);
      const got = (input.value || "").trim().toLowerCase();
      const correct = decodeURIComponent(cf.dataset.correct).trim().toLowerCase();
      const why = decodeURIComponent(cf.dataset.why);
      const ok = got === correct;
      const fb = document.querySelector(`[data-fb="${key}"]`);
      fb.className = "feedback " + (ok ? "ok" : "bad");
      fb.textContent = (ok ? "صحيح. " : `الإجابة: ${decodeURIComponent(cf.dataset.correct)}. `) + why;
      if (!ok) {
        P.mistakes.push(why);
      } else {
        P.xp += 1;
        touchStreak();
      }
      save();
      return;
    }
    const tok = e.target.closest("[data-token]");
    if (tok) {
      const box = tok.closest("[data-order]");
      const key = box.dataset.order;
      orderState[key] = orderState[key] || [];
      orderState[key].push(decodeURIComponent(tok.dataset.token));
      tok.disabled = true;
      const built = document.querySelector(`[data-built="${key}"]`);
      built.textContent = orderState[key].join(" ");
      const need = decodeURIComponent(box.dataset.correct).split(" ").length;
      if (orderState[key].length >= need) {
        const ok = orderState[key].join(" ") === decodeURIComponent(box.dataset.correct);
        const fb = document.querySelector(`[data-fb="${key}"]`);
        const why = decodeURIComponent(box.dataset.why);
        fb.className = "feedback " + (ok ? "ok" : "bad");
        fb.textContent = (ok ? "ترتيب سليم. " : `الترتيب: ${decodeURIComponent(box.dataset.correct)}. `) + why;
        if (!ok) P.mistakes.push(why);
        else {
          P.xp += 1;
          touchStreak();
        }
        save();
      }
      return;
    }
    const done = e.target.closest("[data-act='complete']");
    if (done) {
      const id = done.dataset.id;
      if (!P.completed.includes(id)) {
        P.completed.push(id);
        P.xp += 10;
        touchStreak();
        save();
      }
      toast("أحسنت — نُقل الدرس إلى المكتمل");
      const cur = DATA.lessons.find((l) => l.id === id);
      const next = DATA.lessons.find((l) => l.order === (cur ? cur.order + 1 : -1));
      if (next) go("lesson", next.id);
      else go("me");
      return;
    }
    const playAll = e.target.closest("[data-act='play-all']");
    if (playAll) {
      const c = DATA.talks.find((x) => x.id === playAll.dataset.id);
      if (!c) return;
      let i = 0;
      const next = () => {
        if (!c.lines[i]) return;
        speak(c.lines[i].en);
        i += 1;
        setTimeout(next, 2400);
      };
      next();
      return;
    }
    const sc = e.target.closest("[data-act='score-place']");
    if (sc) {
      const qs = DATA.placement;
      let n = 0;
      qs.forEach((q) => {
        const box = document.querySelector(`[data-qid="${q.id}"]`);
        if (!box) return;
        let got = "";
        const fill = $("[data-fill]", box);
        if (fill) got = fill.value.trim();
        const okBtn = $(".opt.ok", box);
        if (okBtn && okBtn.dataset.pick) got = decodeURIComponent(okBtn.dataset.pick);
        const built = $("[data-built]", box);
        if (built && built.textContent) got = built.textContent;
        if (got.toLowerCase() === String(q.correct).toLowerCase()) n += 1;
      });
      const r = n / qs.length;
      const lv = r < 0.4 ? "pre-a1" : r < 0.75 ? "a1" : "a2";
      const title = DATA.levels.find((l) => l.id === lv);
      P.scores.place = n;
      P.xp += n * 2;
      save();
      $("#place-result").innerHTML = `<div class="panel" style="margin-top:16px"><h2>نتيجتك: ${n} / ${qs.length}</h2><p>المستوى المقترح: <b>${title.titleAr}</b> (${title.titleEn})</p><p class="muted">${title.blurb}</p><button class="btn btn-gold" data-go="learn">ابدأ المسار</button></div>`;
    }
  });

  window.addEventListener("hashchange", page);
  applyTheme();
  if (!location.hash) location.hash = "#/home";
  page();
})();

  </script>
</body>
</html>
